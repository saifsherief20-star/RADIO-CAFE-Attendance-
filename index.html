<style>
:root{
 --bg:#08090c;--panel:#101217;--panel2:#151820;--line:#272b35;

*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0,#1b160e 0,transparent 28%),radial-gradient(circle at 90% 100%,#101828 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit} button{cursor:pointer}
#app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden;position:relative}
.orb{position:absolute;width:380px;height:380px;border-radius:50%;filter:blur(90px);opacity:.22;animation:float 8s ease-in-out infinite}.o1{background:#e4b75d;top:-130px;left:-100px}.o2{background:#5578ff;bottom:-150px;right:-100px;animation-delay:-4s}
@keyframes float{50%{transform:translate(35px,30px) scale(1.1)}}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.login-card{width:min(440px,100%);padding:34px;border:1px solid rgba(228,183,93,.25);background:rgba(16,18,23,.88);backdrop-filter:blur(20px);border-radius:28px;box-shadow:0 30px 100px #0009;animation:pop .7s ease}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}.logo{width:55px;height:55px;border-radius:17px;background:linear-gradient(135deg,var(--gold),#8d6422);display:grid;place-items:center;color:#111;font-size:25px;box-shadow:0 10px 30px #e4b75d33}.brand b{font-size:22px;letter-spacing:2px}.brand small{display:block;color:var(--gold);margin-top:3px;letter-spacing:3px}
h1{font-size:27px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 25px}
.field{margin:14px 0}.field label{display:block;color:#b7bdc8;font-size:13px;margin:0 0 7px}input,select{width:100%;background:#0a0c10;border:1px solid var(--line);color:#fff;padding:14px;border-radius:13px;outline:none}input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e4b75d18}
.primary{border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17130b;font-weight:800;width:100%;margin-top:10px;box-shadow:0 12px 30px #e4b75d2b;transition:.2s}.primary:hover{transform:translateY(-2px)}
.hint{margin-top:20px;padding:12px;border-radius:12px;background:#e4b75d10;color:#c7ad77;font-size:12px}
.shell{display:flex;min-height:100vh}.sidebar{width:250px;padding:20px 14px;border-right:1px solid var(--line);background:#0a0b0f;position:fixed;inset:0 auto 0 0;z-index:5}.side-brand{padding:12px 14px 26px;display:flex;gap:10px;align-items:center}.side-brand .logo{width:42px;height:42px;border-radius:13px;font-size:18px}.side-brand b{font-size:15px;letter-spacing:1px}.side-brand span{font-size:10px;color:var(--gold);display:block;letter-spacing:2px;margin-top:3px}
.nav button{width:100%;border:0;background:transparent;color:#8f96a2;padding:13px 14px;margin:3px 0;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center;transition:.2s}.nav button:hover,.nav button.active{background:#191b21;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}
.main{margin-left:250px;width:calc(100% - 250px);padding:26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h2{margin:0;font-size:25px}.top p{margin:5px 0;color:var(--muted);font-size:13px}.user{display:flex;gap:10px;align-items:center;background:var(--panel);padding:8px 12px;border:1px solid var(--line);border-radius:14px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#393029,var(--gold));font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:linear-gradient(145deg,#14171d,#0d0f14);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #0002}.stat{padding:18px;position:relative;overflow:hidden;animation:pop .5s ease}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-35px;background:var(--glow,#e4b75d);filter:blur(45px);opacity:.2}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:29px;font-weight:800;margin-top:8px}.stat .icon{float:right;font-size:22px}
.content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.card{padding:20px}.card h3{margin:0 0 18px;font-size:16px}.attendance-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:1px solid var(--line);border-radius:17px;padding:18px;background:#0b0d12;color:white;text-align:left;transition:.2s}.action:hover{transform:translateY(-3px);border-color:#555}.action b{display:block;font-size:16px;margin:8px 0}.action small{color:var(--muted)}.checkin{box-shadow:inset 0 0 30px #43d19e08}.checkout{box-shadow:inset 0 0 30px #ff637008}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #20232b;font-size:13px}.badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.present{background:#43d19e18;color:var(--green)}.late{background:#ff637018;color:var(--red)}.team{background:#68a8ff18;color:var(--blue)}
.page{display:none;animation:pop .35s ease}.page.active{display:block}.toolbar{display:flex;gap:10px;justify-content:space-between;margin-bottom:15px}.toolbar input{max-width:320px;padding:11px}.mini{width:auto;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#1a1d24;color:#fff}.gold{background:var(--gold);color:#17130b;border:0;font-weight:bold}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}.modal-box{width:min(450px,100%);background:#12151b;border:1px solid var(--line);border-radius:22px;padding:22px;animation:pop .25s ease}.modal-box h3{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;right:20px;bottom:20px;background:#171b21;border:1px solid var(--line);padding:14px 18px;border-radius:14px;transform:translateY(100px);opacity:0;transition:.3s;z-index:30}.toast.show{transform:none;opacity:1}
@media(max-width:850px){.sidebar{width:70px;padding:12px 8px}.side-brand b,.side-brand span,.nav button span{display:none}.side-brand{padding:8px 5px 20px;justify-content:center}.side-brand .logo{width:42px}.nav button{justify-content:center;padding:14px 0}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}.top{align-items:flex-start}.user div:last-child{display:none}}
@media(max-width:520px){.main{padding:14px}.grid{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat .num{font-size:23px}.top h2{font-size:21px}.attendance-actions{grid-template-columns:1fr}.row{grid-template-columns:1fr}.table-wrap{overflow:auto}.login-card{padding:25px 20px}}
</style>

window.firebaseApp=initializeApp(firebaseConfig);window.firebaseAuth=getAuth(window.firebaseApp);window.firebaseDb=getFirestore(window.firebaseApp);
window.firebaseSecondaryApp=initializeApp(firebaseConfig,"secondary");window.firebaseSecondaryAuth=getAuth(window.firebaseSecondaryApp);

<script>
const DBKEY='radioCafeAttendancePremium';
let cloudReady=false,cloudUnsubs=[];
function cloudRef(c,id){return fb.doc(firebaseDb,c,String(id))}
function stopCloud(){cloudUnsubs.forEach(u=>{try{u()}catch(e){}});cloudUnsubs=[]}
async function loadCloud(){
 const [e,t,r,l,s]=await Promise.all([fb.getDocs(fb.collection(firebaseDb,'employees')),fb.getDocs(fb.collection(firebaseDb,'teams')),fb.getDocs(fb.collection(firebaseDb,'records')),fb.getDocs(fb.collection(firebaseDb,'leaves')),fb.getDoc(fb.doc(firebaseDb,'settings','main'))]);
 data.employees=e.docs.map(x=>({id:x.id,...x.data()}));data.teams=t.docs.map(x=>x.data().name).filter(Boolean);data.records=r.docs.map(x=>({id:x.id,...x.data()}));data.leaves=l.docs.map(x=>({id:x.id,...x.data()}));if(s.exists())data.settings={...defaultData.settings,...s.data()};localStorage.setItem(DBKEY,JSON.stringify(data));
}
async function putCloud(c,id,obj){if(cloudReady)await fb.setDoc(cloudRef(c,id),obj)}
async function deleteCloud(c,id){if(cloudReady)await fb.deleteDoc(cloudRef(c,id))}
function startCloud(){
 stopCloud();
 cloudUnsubs.push(fb.onSnapshot(fb.collection(firebaseDb,'employees'),s=>{data.employees=s.docs.map(x=>({id:x.id,...x.data()}));localStorage.setItem(DBKEY,JSON.stringify(data));if(data.session){renderDashboard();renderAttendance();renderEmployees();renderRecords();renderProfile()}}));
 cloudUnsubs.push(fb.onSnapshot(fb.collection(firebaseDb,'teams'),s=>{data.teams=s.docs.map(x=>x.data().name).filter(Boolean);localStorage.setItem(DBKEY,JSON.stringify(data));if(data.session){renderTeams();renderEmployees();renderRecords()}}));
 cloudUnsubs.push(fb.onSnapshot(fb.collection(firebaseDb,'records'),s=>{data.records=s.docs.map(x=>({id:x.id,...x.data()}));localStorage.setItem(DBKEY,JSON.stringify(data));if(data.session){renderDashboard();renderAttendance();renderRecords();renderProfile()}}));
 cloudUnsubs.push(fb.onSnapshot(fb.collection(firebaseDb,'leaves'),s=>{data.leaves=s.docs.map(x=>({id:x.id,...x.data()}));localStorage.setItem(DBKEY,JSON.stringify(data));if(data.session){renderLeaves();renderDashboard();renderProfile()}}));
}
async function firstSetup(){
 try{
  const username=(prompt('ADMIN username:','admin')||'').trim(),password=prompt('ADMIN password (6+ characters):')||'',name=(prompt('ADMIN name:','Administrator')||'Administrator').trim();
  if(!username||password.length<6)return toast('Enter username and password (6+ characters)');
  const email=`${username}@radiocafe.app`,cred=await fb.createUserWithEmailAndPassword(firebaseAuth,email,password);
  await fb.setDoc(fb.doc(firebaseDb,'users',cred.user.uid),{uid:cred.user.uid,name,role:'Admin',username,email});
  // Employees are created by the Admin from inside the app.
  for(const t of defaultData.teams)await fb.setDoc(cloudRef('teams',t),{name:t});
  await fb.setDoc(fb.doc(firebaseDb,'settings','main'),defaultData.settings);
  data.session={id:'admin',uid:cred.user.uid,name,role:'Admin',username};data.admin={name,username,password:''};cloudReady=true;await loadCloud();startCloud();render();toast('Admin account created ✨');
 }catch(e){console.error(e);toast(e.message||'Setup failed')}
}

const defaultData={
 employees:[
  {id:1,name:'Saif Sherief',role:'Team Leader',team:'Management',username:'saif',password:'1234',image:'',weeklyOff:'Friday',active:true},
  {id:2,name:'Ahmed Mohamed',role:'Staff',team:'Service',username:'ahmed',password:'1234',image:'',weeklyOff:'Friday',active:true},
  {id:3,name:'Omar Ali',role:'Staff',team:'Kitchen',username:'omar',password:'1234',image:'',weeklyOff:'Friday',active:true}
 ],
 teams:['Management','Service','Kitchen'],
 records:[],
 leaves:[],
 settings:{shiftStart:'09:00',shiftEnd:'17:00',weeklyOff:'Friday',theme:'dark'},
 admin:{name:'Administrator',username:'admin',password:'1234'},
 session:null
};
let data=JSON.parse(localStorage.getItem(DBKEY)||'null')||defaultData;
data.employees=(data.employees||[]).map(e=>({...e,active:e.active!==false,image:e.image||'',weeklyOff:e.weeklyOff||data.settings?.weeklyOff||'Friday'}));
data.teams=data.teams||[];
data.records=data.records||[];
data.leaves=data.leaves||[];
data.settings={...defaultData.settings,...(data.settings||{})};
data.admin={...defaultData.admin,...(data.admin||{})};

function save(){localStorage.setItem(DBKEY,JSON.stringify(data))}
function now(){return new Date()}
function fmt(d){return d?new Date(d).toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short',year:'numeric'}):'—'}
function localDateKey(d=new Date()){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function dateKey(d){return localDateKey(d)}
function monthKey(d){return localDateKey(d).slice(0,7)}
function today(){return localDateKey(now())}
function toast(msg){let t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function initials(name){return (name||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function isLeave(empId,d){
 const k=dateKey(d);
 return data.leaves.find(l=>l.empId===empId && k>=l.from && k<=l.to);
}
function employee(id){return data.employees.find(e=>e.id===id)}
function workMinutes(r){if(!r?.in||!r?.out)return 0;return Math.max(0,Math.round((new Date(r.out)-new Date(r.in))/60000))}
function hm(m){return `${Math.floor(m/60)}h ${m%60}m`}
function isWeeklyOff(emp,d){
 const e=employee(emp); if(!e)return false;
 return new Date(d).toLocaleDateString('en-US',{weekday:'long'})===e.weeklyOff;
}
function scheduledDays(empId,month){
 const [y,m]=month.split('-').map(Number), days=new Date(y,m,0).getDate();
 let n=0; for(let i=1;i<=days;i++){let d=new Date(y,m-1,i);if(!isWeeklyOff(empId,d)&&!isLeave(empId,d))n++}
 return n;
}
function recordsFor(empId,month){
 return data.records.filter(r=>r.empId===empId&&monthKey(r.in)===month)
}
function statsFor(empId,month){
 const rs=recordsFor(empId,month);
 const present=new Set(rs.map(r=>dateKey(r.in)));
 const late=rs.filter(r=>r.late).length;
 const mins=rs.reduce((a,r)=>a+workMinutes(r),0);
 let [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),absent=0;
 for(let i=1;i<=days;i++){
   let d=new Date(y,m-1,i),k=dateKey(d);
   if(isWeeklyOff(empId,d)||isLeave(empId,d))continue;
   if(!present.has(k))absent++;
 }
 const expected=scheduledDays(empId,month);
 return {present:present.size,late,mins,absent,expected,rate:expected?Math.round(present.size/expected*100):100};
}
window.firstSetup=firstSetup;
async function login(){
 let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
 if(!u||!p)return toast('Enter username and password');
 try{
  const email=u.includes('@')?u:`${u}@radiocafe.app`;
  const cred=await fb.signInWithEmailAndPassword(firebaseAuth,email,p);
  const us=await fb.getDoc(fb.doc(firebaseDb,'users',cred.user.uid));
  if(!us.exists())throw new Error('User profile is missing');
  const profile=us.data();
  if(profile.active===false)throw new Error('This account is inactive. Contact the administrator.');
  data.session=profile.role==='Admin'
   ?{id:'admin',uid:cred.user.uid,name:profile.name||'Administrator',role:'Admin',username:profile.username||u}
   :{id:String(profile.employeeId),uid:cred.user.uid,name:profile.name||u,role:profile.role||'Staff',username:profile.username||u};
  cloudReady=true;await loadCloud();
  if(data.session.role!=='Admin'){
    const e=employee(data.session.id);
    if(!e||e.active===false){await fb.signOut(firebaseAuth);cloudReady=false;throw new Error('This employee account is inactive.');}
    data.session={...e,uid:cred.user.uid};
  }
  startCloud();render();
 }catch(e){
  console.error(e);
  toast(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'?'Wrong username or password':(e.message||'Login failed'));
 }
}
async function logout(){stopCloud();cloudReady=false;try{await fb.signOut(firebaseAuth)}catch(e){}data.session=null;localStorage.setItem(DBKEY,JSON.stringify(data));render()}
function loginPage(){
 document.getElementById('app').innerHTML=`<div class="login"><div class="orb o1"></div><div class="orb o2"></div><div class="login-card"><div class="brand"><div class="logo">📻</div><div><b>RADIO CAFE</b><small>ATTENDANCE SYSTEM</small></div></div><h1>Welcome back</h1><p class="sub">Sign in to manage your attendance.</p><div class="field"><label>USERNAME</label><input id="u" placeholder="Enter username"></div><div class="field"><label>PASSWORD</label><input id="p" type="password" placeholder="Enter password"></div><button class="primary" onclick="login()">SIGN IN →</button><button class="mini" style="width:100%;margin-top:10px" onclick="firstSetup()">⚙️ First-time Admin Setup</button><div class="hint>🔒 Secure staff attendance system</div></div></div>`
}
function nav(id,icon,label){return `<button id="nav-${id}" onclick="showPage('${id}')">${icon} <span>${label}</span></button>`}
function shell(){
 let s=data.session;
 document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="side-brand"><div class="logo">📻</div><div><b>RADIO CAFE</b><span>ATTENDANCE</span></div></div><nav class="nav">
 ${nav('dashboard','◈','Dashboard')}${nav('attendance','◷','Attendance')}${s.role==='Admin'?nav('records','▤','Records'):''}${s.role==='Admin'?nav('employees','♟','Employees'):''}${s.role==='Admin'?nav('leaves','🏖','Leaves'):''}${s.role==='Admin'?nav('teams','◇','Teams'):''}${s.role==='Admin'?nav('shift','◴','Schedule'):''}${nav('profile','👤','Profile')}${s.role==='Admin'?nav('adminaccount','⚙','Admin Account'):''}
 </nav><button class="nav" style="margin-top:10px" onclick="toggleTheme()">☀️ <span>Dark / Light</span></button><nav class="nav"><button onclick="logout()">↪ <span>Logout</span></button></nav></aside>
 <main class="main"><div class="top"><div><h2 id="title">Dashboard</h2><p>RADIO CAFE • Premium Attendance Management</p></div><div class="user"><div class="avatar">${s.image?`<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:initials(s.name)}</div><div><b>${esc(s.name)}</b><br><small style="color:var(--muted)">${esc(s.role)}</small></div></div></div>
 <section id="dashboard" class="page active"></section><section id="attendance" class="page"></section><section id="records" class="page"></section><section id="employees" class="page"></section><section id="leaves" class="page"></section><section id="teams" class="page"></section><section id="shift" class="page"></section><section id="profile" class="page"></section><section id="adminaccount" class="page"></section></main></div><div class="modal" id="modal"></div>`;
 applyTheme(); renderDashboard();renderAttendance();renderRecords();renderEmployees();renderLeaves();renderTeams();renderShift();renderProfile();renderAdminAccount()
}
function showPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
 let p=document.getElementById(id);if(p)p.classList.add('active');let b=document.getElementById('nav-'+id);if(b)b.classList.add('active');document.getElementById('title').textContent=b?b.innerText.trim():id
}
function recordsToday(){return data.records.filter(r=>dateKey(r.in)===today())}
function renderDashboard(){
 let r=recordsToday(),late=r.filter(x=>x.late).length,out=r.filter(x=>x.out).length;
 let open=r.filter(x=>!x.out).length,missing=data.employees.filter(e=>!r.some(x=>x.empId===e.id));
 let alerts=missing.length?`<div class="hint" style="margin:0 0 16px">⚠️ ${missing.length} employee(s) have not checked in today: ${missing.map(e=>esc(e.name)).join(', ')}</div>`:`<div class="hint" style="margin:0 0 16px">🟢 All employees have recorded attendance today.</div>`;
 document.getElementById('dashboard').innerHTML=`${alerts}<div class="grid"><div class="stat" style="--glow:#68a8ff"><span class="icon">👥</span><div class="label">TOTAL EMPLOYEES</div><div class="num">${data.employees.length}</div></div><div class="stat" style="--glow:#43d19e"><span class="icon">🟢</span><div class="label">CHECKED IN TODAY</div><div class="num">${r.length}</div></div><div class="stat" style="--glow:#ff6370"><span class="icon">⏰</span><div class="label">LATE TODAY</div><div class="num">${late}</div></div><div class="stat" style="--glow:#e4b75d"><span class="icon">✓</span><div class="label">CHECKED OUT</div><div class="num">${out}</div></div></div>
 <div class="content-grid"><div class="card"><h3>Today's Attendance</h3><div class="table-wrap">${table(r.slice().reverse().slice(0,8))}</div></div><div class="card"><h3>Smart Alerts 🔔</h3>${r.filter(x=>x.late).map(x=>`<p>⚠️ <b>${esc(x.name)}</b> was late today.</p>`).join('')||'<p class="sub">No late arrivals today.</p>'}${r.filter(x=>!x.out).map(x=>`<p>🔴 <b>${esc(x.name)}</b> has not checked out.</p>`).join('')||'<p class="sub">No missing check-outs.</p>'}<button class="mini gold" onclick="showPage('records')">Open Reports</button></div></div>`
}
function myRecord(){let s=data.session;if(s.role==='Admin')return null;return data.records.find(r=>r.empId===s.id&&dateKey(r.in)===today())}
function renderAttendance(){
 let s=data.session,rec=myRecord();
 document.getElementById('attendance').innerHTML=`<div class="content-grid"><div class="card"><h3>Attendance Control</h3>${s.role==='Admin'?`<p class="sub">Admin can review attendance from Records and Staff Reports.</p>`:`<div class="attendance-actions"><button class="action checkin" ${rec?'disabled':''} onclick="checkIn()">🟢<b>${rec?'Already Checked In':'Check In'}</b><small>${rec?'Time: '+fmt(rec.in):'Start your work day'}</small></button><button class="action checkout" ${!rec||rec.out?'disabled':''} onclick="checkOut()">🔴<b>${rec&&rec.out?'Checked Out':'Check Out'}</b><small>${rec&&rec.out?'Time: '+fmt(rec.out):'End your work day'}</small></button></div>`}</div>
 <div class="card"><h3>Live Clock</h3><div id="clock" style="font-size:32px;font-weight:800;color:var(--gold)">--:--:--</div><p class="sub">Shift: ${data.settings.shiftStart} → ${data.settings.shiftEnd} • Late after shift start</p></div></div>`;
 setInterval(()=>{let c=document.getElementById('clock');if(c)c.textContent=now().toLocaleTimeString('en-GB')},1000)
}
async function checkIn(){
 let s=data.session,d=now();
 if(!s||s.role==='Admin')return;
 if(isWeeklyOff(s.id,d))return toast('📅 Today is your weekly day off.');
 if(isLeave(s.id,d))return toast('🏖️ You are on approved leave today.');
 if(myRecord())return;
 let [hh,mm]=data.settings.shiftStart.split(':').map(Number);
 let late=d.getHours()>hh||(d.getHours()===hh&&d.getMinutes()>mm);
 const record={id:String(Date.now()),empId:String(s.id),name:s.name,team:s.team,in:d.toISOString(),out:null,late,createdAt:d.toISOString()};
 try{
   if(!cloudReady)throw new Error('Firebase is not connected');
   await putCloud('records',record.id,record);
   data.records.push(record);save();
   toast(late?'⚠️ Checked in — marked late':'🟢 Check in successful!');
   renderAttendance();renderDashboard();renderRecords();renderProfile();
 }catch(e){console.error(e);toast(e?.code==='permission-denied'?'Permission denied by Firebase rules':(e?.message||'Check in was not saved'))}
}
async function checkOut(){let r=myRecord();if(!r)return;r.out=now().toISOString();r.minutes=workMinutes(r);save();if(cloudReady)putCloud('records',r.id,r);toast(`🔴 Check out successful! Worked ${hm(r.minutes)}`);renderAttendance();renderDashboard();renderRecords();renderProfile()}
function table(list){
 if(!list.length)return `<p class="sub">No attendance records yet.</p>`;
 return `<table><thead><tr><th>Employee</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th></tr></thead><tbody>${list.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small style="color:var(--muted)">${esc(r.team||'')}</small></td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td>${r.out?hm(workMinutes(r)):'—'}</td><td><span class="badge ${r.late?'late':'present'}">${r.late?'LATE':'ON TIME'}</span>${!r.out?'<span class="badge late" style="margin-left:4px">NO CHECK OUT</span>':''}</td></tr>`).join('')}</tbody></table>`
}
function renderRecords(){
 let el=document.getElementById('records');if(!el)return;
 let current=el.dataset.month||monthKey(now()),team=el.dataset.team||'all',status=el.dataset.status||'all',q=el.dataset.q||'';
 let list=data.records.filter(r=>monthKey(r.in)===current&&(team==='all'||r.team===team)&&(status==='all'||(status==='late'&&r.late)||(status==='present'&&!r.late)||(status==='open'&&!r.out))).filter(r=>(r.name+' '+r.team).toLowerCase().includes(q.toLowerCase())).slice().reverse();
 el.innerHTML=`<div class="card"><div class="toolbar" style="align-items:center;flex-wrap:wrap"><div><h3>Attendance Records & Reports</h3><p class="sub">Search, filter and export the selected month.</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="month" id="recordMonth" value="${current}" style="width:auto" onchange="recordFilter()"><select id="recordTeam" style="width:auto" onchange="recordFilter()"><option value="all">All Teams</option>${data.teams.map(t=>`<option ${team===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="recordStatus" style="width:auto" onchange="recordFilter()"><option value="all">All Status</option><option value="present" ${status==='present'?'selected':''}>Present</option><option value="late" ${status==='late'?'selected':''}>Late</option><option value="open" ${status==='open'?'selected':''}>Missing Check Out</option></select><input id="recordSearch" value="${esc(q)}" placeholder="Search employee..." style="width:180px" oninput="recordFilter()"><button class="mini gold" onclick="exportCSV()">↓ CSV</button><button class="mini gold" onclick="exportExcel()">↓ Excel</button><button class="mini gold" onclick="exportPDF()">↓ PDF</button></div></div>
 <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:15px"><div class="stat"><div class="label">RECORDS</div><div class="num">${list.length}</div></div><div class="stat"><div class="label">LATE</div><div class="num">${list.filter(r=>r.late).length}</div></div><div class="stat"><div class="label">HOURS</div><div class="num">${hm(list.reduce((a,r)=>a+workMinutes(r),0))}</div></div><div class="stat"><div class="label">NO CHECK OUT</div><div class="num">${list.filter(r=>!r.out).length}</div></div></div><div class="table-wrap">${table(list)}</div></div>`;
}
function recordFilter(){let el=document.getElementById('records');el.dataset.month=document.getElementById('recordMonth').value;el.dataset.team=document.getElementById('recordTeam').value;el.dataset.status=document.getElementById('recordStatus').value;el.dataset.q=document.getElementById('recordSearch').value;renderRecords()}
function staffReport(id){
 let month=prompt('Enter month (YYYY-MM):',monthKey(now()));if(!month)return;let e=employee(id),s=statsFor(id,month);
 document.getElementById('modal').innerHTML=`<div class="modal-box" style="width:min(850px,100%)"><h3>📊 ${esc(e.name)} — Monthly Report</h3><p class="sub">${month} • ${esc(e.team)} • Weekly off: ${esc(e.weeklyOff)}</p><div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="stat"><div class="label">PRESENT</div><div class="num">${s.present}</div></div><div class="stat"><div class="label">LATE</div><div class="num">${s.late}</div></div><div class="stat"><div class="label">WORK HOURS</div><div class="num" style="font-size:22px">${hm(s.mins)}</div></div><div class="stat"><div class="label">ABSENT</div><div class="num">${s.absent}</div></div><div class="stat"><div class="label">COMPLIANCE</div><div class="num">${s.rate}%</div></div></div><div style="margin-top:18px">${table(recordsFor(id,month).slice().reverse())}</div><button class="mini" style="margin-top:14px" onclick="closeModal()">Close</button></div>`;
 document.getElementById('modal').classList.add('show')
}
function renderEmployees(){
 let el=document.getElementById('employees');if(!el)return;
 el.innerHTML=`<div class="card"><div class="toolbar"><h3>Employees</h3><div style="display:flex;gap:8px"><button class="mini gold" onclick="employeeModal()">+ Add Employee</button></div></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Role</th><th>Team</th><th>Weekly Off</th><th>Status</th><th>Actions</th></tr></thead><tbody>${data.employees.map(e=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="avatar">${e.image?`<img src="${e.image}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:initials(e.name)}</div><b>${esc(e.name)}</b></div></td><td><span class="badge team">${esc(e.role)}</span></td><td>${esc(e.team)}</td><td>${esc(e.weeklyOff)}</td><td><span class="badge ${e.active!==false?'present':'late'}">${e.active!==false?'ACTIVE':'INACTIVE'}</span></td><td style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini gold" onclick="staffReport(${e.id})">📊 Report</button><button class="mini" onclick="editEmp(${e.id})">Edit</button><button class="mini" onclick="toggleEmployee(${e.id})">${e.active!==false?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div></div>`
}
function employeeModal(id=null){
 let e=id?employee(id):{name:'',role:'Staff',team:data.teams[0]||'',username:'',password:'1234',weeklyOff:data.settings.weeklyOff,image:''};
 document.getElementById('modal').innerHTML=`<div class="modal-box"><h3>${id?'Edit':'Add'} Employee</h3><div class="field"><label>FULL NAME</label><input id="en" value="${esc(e.name)}"></div><div class="row"><div class="field"><label>ROLE</label><select id="er"><option ${e.role==='Staff'?'selected':''}>Staff</option><option ${e.role==='Team Leader'?'selected':''}>Team Leader</option></select></div><div class="field"><label>TEAM</label><select id="et">${data.teams.map(t=>`<option ${e.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>WEEKLY DAY OFF</label><select id="eo">${['Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'].map(x=>`<option ${e.weeklyOff===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>PHOTO</label><input id="ei" type="file" accept="image/*"></div></div><div class="row"><input id="eu" value="${esc(e.username)}" placeholder="Username" ${id?'readonly':''}><input id="ep" value="" type="password" placeholder="${id?'Leave blank to keep password':'Password (6+ chars)'}"></div><div style="display:flex;gap:10px;margin-top:18px"><button class="primary" onclick="${id?`saveEmpEdit(${id})`:'addEmp()'}">${id?'Save Changes':'Save Employee'}</button><button class="mini" onclick="closeModal()">Cancel</button></div></div>`;
 document.getElementById('modal').classList.add('show')
}
function readImage(cb){let f=document.getElementById('ei')?.files?.[0];if(!f)return cb(null);let rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsDataURL(f)}
async function addEmp(){
 let name=en.value.trim(),username=eu.value.trim(),password=ep.value;if(!name||!username||!password)return toast('Please complete all fields');if(password.length<6)return toast('Password must be at least 6 characters');
 readImage(async img=>{try{const email=`${username}@radiocafe.app`,cred=await fb.createUserWithEmailAndPassword(firebaseSecondaryAuth,email,password),id=String(Date.now()),emp={id,name,role:er.value,team:et.value,username,password:'',weeklyOff:eo.value,image:img||'',uid:cred.user.uid,email,active:true};
 await fb.setDoc(cloudRef('employees',id),emp);await fb.setDoc(fb.doc(firebaseDb,'users',cred.user.uid),{uid:cred.user.uid,employeeId:id,name,role:emp.role,username,email});await fb.signOut(firebaseSecondaryAuth);closeModal();toast('Employee account created ✨')}
 catch(e){console.error(e);toast(e.code==='auth/email-already-in-use'?'Username already exists':(e.message||'Could not create account'))}});
}
function editEmp(id){employeeModal(id)}
async function saveEmpEdit(id){
 let e=employee(id);if(!e)return;readImage(async img=>{try{e.name=en.value.trim()||e.name;e.role=er.value;e.team=et.value;e.weeklyOff=eo.value;e.username=eu.value.trim()||e.username;if(img)e.image=img;await putCloud('employees',id,e);if(e.uid)await fb.setDoc(fb.doc(firebaseDb,'users',e.uid),{uid:e.uid,employeeId:String(id),name:e.name,role:e.role,username:e.username,email:e.email||`${e.username}@radiocafe.app`},{merge:true});closeModal();toast('Employee updated successfully ✨')}catch(err){console.error(err);toast(err.message||'Could not update employee')}})
}
async function toggleEmployee(id){
 const e=employee(id);if(!e)return;
 const next=e.active===false;
 try{
   e.active=next;
   await putCloud('employees',id,e);
   if(e.uid)await fb.setDoc(fb.doc(firebaseDb,'users',e.uid),{active:next},{merge:true});
   save();renderEmployees();toast(next?'Employee activated ✨':'Employee deactivated 🔒');
 }catch(err){
   e.active=!next;save();
   console.error(err);toast(err?.message||'Could not update employee status');
 }
}
function renderLeaves(){
 let el=document.getElementById('leaves');if(!el)return;
 el.innerHTML=`<div class="card"><div class="toolbar"><div><h3>🏖️ Leave Management</h3><p class="sub">Approved leave days are excluded from absence calculations.</p></div><button class="mini gold" onclick="leaveModal()">+ Add Leave</button></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Reason</th><th>From</th><th>To</th><th>Actions</th></tr></thead><tbody>${data.leaves.slice().reverse().map(l=>`<tr><td><b>${esc(employee(l.empId)?.name||l.empName)}</b></td><td>${esc(l.reason)}</td><td>${l.from}</td><td>${l.to}</td><td><button class="mini" onclick="removeLeave(${l.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No leave records.</td></tr>'}</tbody></table></div></div>`
}
function leaveModal(){document.getElementById('modal').innerHTML=`<div class="modal-box"><h3>Add Employee Leave</h3><div class="field"><label>EMPLOYEE</label><select id="le"><option value="">Choose employee</option>${data.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>REASON</label><input id="lr" placeholder="Vacation, personal, etc."></div><div class="row"><div class="field"><label>FROM</label><input id="lf" type="date"></div><div class="field"><label>TO</label><input id="lt" type="date"></div></div><button class="primary" onclick="addLeave()">Save Leave</button><button class="mini" style="margin-top:10px" onclick="closeModal()">Cancel</button></div>`;document.getElementById('modal').classList.add('show')}
function addLeave(){if(!le.value||!lf.value||!lt.value||lf.value>lt.value)return toast('Complete valid leave dates');const leave={id:String(Date.now()),empId:String(le.value),reason:lr.value||'Leave',from:lf.value,to:lt.value};data.leaves.push(leave);save();if(cloudReady)putCloud('leaves',leave.id,leave);closeModal();renderLeaves();toast('🏖️ Leave saved')}
async function removeLeave(id){data.leaves=data.leaves.filter(x=>String(x.id)!==String(id));await deleteCloud('leaves',id);save();renderLeaves();toast('Leave removed')}
function renderTeams(){let el=document.getElementById('teams');if(!el)return;el.innerHTML=`<div class="card"><div class="toolbar"><h3>Teams</h3><button class="mini gold" onclick="teamModal()">+ Add Team</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${data.teams.map(t=>`<div class="stat"><div class="label">TEAM</div><div class="num" style="font-size:18px">${esc(t)}</div><div style="margin-top:10px;color:var(--muted);font-size:12px">${data.employees.filter(e=>e.team===t).length} members</div></div>`).join('')}</div></div>`}
function teamModal(){document.getElementById('modal').innerHTML=`<div class="modal-box"><h3>Create Team</h3><div class="field"><input id="tn" placeholder="Team name"></div><button class="primary" onclick="addTeam()">Create Team</button><button class="mini" style="margin-top:10px" onclick="closeModal()">Cancel</button></div>`;document.getElementById('modal').classList.add('show')}
function addTeam(){let n=tn.value.trim();if(!n)return;if(data.teams.includes(n))return toast('Team already exists');data.teams.push(n);save();if(cloudReady)putCloud('teams',n,{name:n});closeModal();renderTeams();renderEmployees();toast('New team created ✨')}
function renderShift(){
 let el=document.getElementById('shift');if(!el)return;let st=data.settings;
 el.innerHTML=`<div class="content-grid"><div class="card"><h3>Work Schedule</h3><p class="sub">Set working hours and the default weekly day off. Each employee can have a different day off from Employees.</p><div class="row"><div class="field"><label>SHIFT START</label><input id="shiftStart" type="time" value="${st.shiftStart}"></div><div class="field"><label>SHIFT END</label><input id="shiftEnd" type="time" value="${st.shiftEnd}"></div></div><div class="field"><label>DEFAULT WEEKLY OFF</label><select id="weeklyOff">${['Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'].map(x=>`<option ${st.weeklyOff===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="primary" onclick="saveShift()">Save Schedule</button></div><div class="card"><h3>Current Schedule</h3><div style="font-size:30px;font-weight:800;color:var(--gold)">${st.shiftStart}</div><p class="sub">Start of shift</p><div style="font-size:30px;font-weight:800;color:var(--blue)">${st.shiftEnd}</div><p class="sub">End of shift</p><div class="badge team">Default day off: ${st.weeklyOff}</div></div></div>`
}
async function saveShift(){
 data.settings.shiftStart=shiftStart.value||'09:00';data.settings.shiftEnd=shiftEnd.value||'17:00';data.settings.weeklyOff=weeklyOff.value||'Friday';
 try{
  if(cloudReady)await fb.setDoc(fb.doc(firebaseDb,'settings','main'),data.settings);
  save();renderShift();renderAttendance();toast('Schedule updated ⏰');
 }catch(e){console.error(e);toast(e.message||'Schedule was not saved')}
}
function renderAdminAccount(){let el=document.getElementById('adminaccount');if(!el)return;let a=data.admin;el.innerHTML=`<div class="content-grid"><div class="card"><h3>Admin Account Settings</h3><div class="field"><label>ADMIN NAME</label><input id="adminName" value="${esc(a.name)}"></div><div class="field"><label>USERNAME</label><input id="adminUser" value="${esc(a.username)}"></div><div class="field"><label>NEW PASSWORD</label><input id="adminPass" type="password" value="${esc(a.password)}"></div><button class="primary" onclick="saveAdminAccount()">Save Admin Changes</button></div><div class="card"><h3>Administrator</h3><div class="avatar" style="width:65px;height:65px;font-size:26px;margin-bottom:15px">${initials(a.name)}</div><div style="font-size:22px;font-weight:800">${esc(a.name)}</div><p class="sub">Full system access</p><div class="badge team">ADMIN</div></div></div>`}
function saveAdminAccount(){let name=adminName.value.trim(),user=adminUser.value.trim(),pass=adminPass.value;if(!name||!user||!pass)return toast('Please complete all admin details');data.admin={name,username:user,password:pass};if(data.session?.role==='Admin')data.session={id:'admin',name,role:'Admin',username:user};save();renderAdminAccount();toast('Admin account updated 🔐')}
function closeModal(){document.getElementById('modal')?.classList.remove('show')}
function toggleTheme(){data.settings.theme=data.settings.theme==='light'?'dark':'light';save();applyTheme()}
function applyTheme(){document.body.dataset.theme=data.settings.theme;document.documentElement.style.setProperty('--bg',data.settings.theme==='light'?'#f3f4f6':'#08090c');document.documentElement.style.setProperty('--panel',data.settings.theme==='light'?'#fff':'#101217');document.documentElement.style.setProperty('--text',data.settings.theme==='light'?'#17191e':'#f5f5f2')}
function exportRows(){
 let el=document.getElementById('records'),m=el?.dataset.month||monthKey(now()),team=el?.dataset.team||'all',status=el?.dataset.status||'all',q=el?.dataset.q||'';
 return data.records.filter(r=>monthKey(r.in)===m&&(team==='all'||r.team===team)&&(status==='all'||(status==='late'&&r.late)||(status==='present'&&!r.late)||(status==='open'&&!r.out))).filter(r=>(r.name+' '+r.team).toLowerCase().includes(q.toLowerCase()))
}
function exportCSV(){
 let rows=exportRows(),out=[['Employee','Team','Check In','Check Out','Hours','Minutes','Status'],...rows.map(r=>[r.name,r.team,fmt(r.in),fmt(r.out),r.out?hm(workMinutes(r)):'',workMinutes(r),r.late?'Late':'Present'])];
 let csv=out.map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');downloadBlob(csv,'radio-cafe-attendance.csv','text/csv')
}
function exportExcel(){
 let rows=exportRows(),html='<table border="1"><tr><th>Employee</th><th>Team</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Minutes</th><th>Status</th></tr>'+rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.team)}</td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td>${r.out?hm(workMinutes(r)):''}</td><td>${workMinutes(r)}</td><td>${r.late?'Late':'Present'}</td></tr>`).join('')+'</table>';
 downloadBlob('\ufeff'+html,'radio-cafe-attendance.xls','application/vnd.ms-excel')
}
function exportPDF(){
 let rows=exportRows(),w=window.open('','_blank');if(!w)return toast('Please allow popups for PDF export');
 w.document.write(`<html><head><title>Radio Cafe Attendance</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:7px;text-align:left}h1{margin-bottom:4px}</style></head><body><h1>RADIO CAFE — Attendance Report</h1><p>${monthKey(now())}</p><table><tr><th>Employee</th><th>Team</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.team)}</td><td>${fmt(r.in)}</td><td>${fmt(r.out)}</td><td>${r.out?hm(workMinutes(r)):'—'}</td><td>${r.late?'Late':'Present'}</td></tr>`).join('')}</table><script>window.print()<\/script></body></html>`);w.document.close()
}
function downloadBlob(content,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){data.session?shell():loginPage()}
render();
</script>
</body></html>
